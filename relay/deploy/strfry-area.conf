##
## cubechat's area relay: the third strfry, behind /area. The public district,
## city and region chats and the notes on the map. A process and a database of
## its own, like /media — see "The area relay" in relay/README.md — so a full
## public chat cannot take the private lane down, and its retention is its own.
##

db = "/opt/cubechat-area-relay/strfry-db/"

dbParams {
    # Small on purpose: everything here lives a day, notes a week, and each
    # event is at most 4 KiB. A ceiling, not an allocation.
    maxreaders = 256
    mapsize = 2147483648
}

relay {
    # Loopback only; Caddy holds the certificate and the name.
    bind = "127.0.0.1"
    port = 8083

    # Public by design: no AUTH, no restricted kinds. Anybody who knows a
    # city's geohash may read it, and the app and the privacy policy say so.
    auth {
        enabled = false
    }

    nofiles = 65536

    # The client address reaches the write policy for its per-address counts,
    # which live in memory only. Nothing here logs it (logging below, and the
    # /area block in Caddy has no access log).
    realIpHeader = "x-forwarded-for"

    info {
        name = "cubechat area"
        description = "The cubechat area chat. Public, kept for 24 hours (notes up to 7 days)."
        pubkey = ""
        contact = "cubechatble@gmail.com"
    }

    # The app hangs up on a frame over 64 KiB; an event is at most 4 KiB.
    maxWebsocketPayloadSize = 16384

    # Two filters per REQ (messages and presence, notes), on at most five
    # geohashes each.
    maxReqFilterSize = 50
    maxSubsPerConnection = 4

    writePolicy {
        plugin = "/opt/cubechat-area-relay/area-policy.mjs"
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    # Nothing about who asked for what is written anywhere.
    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
    }

    numThreads {
        ingester = 1
        reqWorker = 2
        reqMonitor = 1
        negentropy = 1
    }
}

events {
    maxEventSize = 4096

    # g, expiration, nonce, e — a handful.
    maxNumTags = 8
    maxTagValSize = 128

    rejectEventsNewerThanSeconds = 300

    # A note may be seven days old; nothing older is ours.
    rejectEventsOlderThanSeconds = 604800

    # Presence (21060) is ephemeral: handed to whoever is subscribed, stored
    # nowhere.
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 120
}

##
## What the privacy policy promises: messages a day, notes at most a week.
## Every event also carries a NIP-40 expiration, which strfry honours on its
## own; this is the backstop for one that somehow got past the policy.
##
retention = [
    { kinds = [1060], time = 86400 },
    { kinds = [1062], time = 604800 },
    { kinds = [5], time = 604800 },
    { time = 86400 }
]
